name: pages
on:
  push:
    branches: [main]
    # The Go code and the site share a repo but not a release cadence; only
    # site changes should redeploy the site.
    paths:
      - 'www/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; queue instead of cancelling, so the last push
# to land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            www/package-lock.json
            docs/package-lock.json

      # Two Next apps, one Pages site. www owns the root and docs owns /docs,
      # each with its own basePath so their _next directories cannot collide;
      # the merge below is then a plain copy with nothing to collide.
      - run: npm ci
        working-directory: www
      - run: npm run build
        working-directory: www

      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs

      - run: mv docs/out www/out/docs

      # --branch=main targets the Pages project's production branch, so this is
      # the live deployment rather than a preview.
      #
      # packageManager is explicit because there is no lockfile in the repo
      # root for the action to infer from, and without it npx is asked to
      # fetch wrangler — a question CI cannot answer, so it cancels.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy www/out --project-name=tennis --branch=main